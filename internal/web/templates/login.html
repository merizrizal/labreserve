<!doctype html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
{{template "header" .}}
<main class="narrow">
  <h1>Sign in</h1>
  <p>Use one of the fictional development accounts.</p>
  {{if .Error}}<p class="notice error" role="alert">{{.Error}}</p>{{end}}
  <form action="/login" method="post" class="stack">
    <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
    <label for="login">Email</label>
    <input id="login" name="login" type="email" autocomplete="username" value="{{.Login}}" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</main>
{{template "footer" .}}
